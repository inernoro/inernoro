<rect x="1" y="1" width="598" height="958" rx="18" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="37" fill="#80a4c2" font-size="12" font-weight="400" letter-spacing="2">SYSTEMS / PRD AGENT</text><text x="30" y="83" fill="#eef5ff" font-size="34" font-weight="700">The systems behind</text><text x="30" y="125" fill="#eef5ff" font-size="34" font-weight="700">the product.</text><rect x="30" y="158" width="540" height="230" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M50 159H550" stroke="#79dff1" stroke-width="2"/><text x="54" y="190" fill="#79dff1" font-size="12" font-weight="400" letter-spacing="1.6">01 / WORKSPACE</text><text x="54" y="230" fill="#edf5ff" font-size="25" font-weight="700">Product &amp; knowledge</text><text x="54" y="268" fill="#a9bed4" font-size="16" font-weight="400">PRDs, Q&amp;A and citations</text><text x="54" y="295" fill="#a9bed4" font-size="16" font-weight="400">Agent workflows and reviews</text><text x="54" y="322" fill="#a9bed4" font-size="16" font-weight="400">Web console + desktop client</text><path d="M54 340H546" stroke="#20384e"/><text x="54" y="366" fill="#779bb9" font-size="13" font-weight="400">.NET / React / Tauri</text><rect x="30" y="408" width="540" height="230" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M50 409H550" stroke="#a5b9ff" stroke-width="2"/><text x="54" y="440" fill="#a5b9ff" font-size="12" font-weight="400" letter-spacing="1.6">02 / MODEL EXECUTION</text><text x="54" y="480" fill="#edf5ff" font-size="25" font-weight="700">LLM Gateway</text><text x="54" y="518" fill="#a9bed4" font-size="16" font-weight="400">Model pools and provider routing</text><text x="54" y="545" fill="#a9bed4" font-size="16" font-weight="400">Request logs and health signals</text><text x="54" y="572" fill="#a9bed4" font-size="16" font-weight="400">Bounded retries and fallback</text><path d="M54 590H546" stroke="#20384e"/><text x="54" y="616" fill="#779bb9" font-size="13" font-weight="400">.NET / Provider adapters</text><rect x="30" y="658" width="540" height="230" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M50 659H550" stroke="#82d8be" stroke-width="2"/><text x="54" y="690" fill="#82d8be" font-size="12" font-weight="400" letter-spacing="1.6">03 / BRANCH DELIVERY</text><text x="54" y="730" fill="#edf5ff" font-size="25" font-weight="700">Cloud Dev Suite</text><text x="54" y="768" fill="#a9bed4" font-size="16" font-weight="400">Branch builds and preview routes</text><text x="54" y="795" fill="#a9bed4" font-size="16" font-weight="400">Resumable deployment records</text><text x="54" y="822" fill="#a9bed4" font-size="16" font-weight="400">Reusable versions and rollback</text><path d="M54 840H546" stroke="#20384e"/><text x="54" y="866" fill="#779bb9" font-size="13" font-weight="400">Docker / Branch previews</text><text x="30" y="932" fill="#8baac5" font-size="16" font-weight="400">Selected modules. Explore the source below.</text></g>
</svg>