<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title">
<title id="title">Inside PRD Agent: product workspace, LLM Gateway, and Cloud Dev Suite.</title>
