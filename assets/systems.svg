<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="38" fill="#80a4c2" font-size="12" font-weight="400" letter-spacing="2.5">SYSTEMS / PRD AGENT</text><text x="40" y="87" fill="#eef5ff" font-size="36" font-weight="700">The systems behind the product.</text><text x="40" y="121" fill="#a9bed4" font-size="18" font-weight="400">A source-linked view of model execution and branch delivery.</text><rect x="40" y="156" width="320" height="200" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M60 157H340" stroke="#79dff1" stroke-width="2"/><text x="64" y="188" fill="#79dff1" font-size="12" font-weight="400" letter-spacing="1.6">01 / APPLICATION</text><text x="64" y="228" fill="#edf5ff" font-size="25" font-weight="700">PRD Agent</text><text x="64" y="266" fill="#a9bed4" font-size="16" font-weight="400">Product knowledge + agent workflows</text><text x="64" y="293" fill="#a9bed4" font-size="16" font-weight="400">Web console + desktop client</text><path d="M64 308H336" stroke="#20384e"/><text x="64" y="334" fill="#779bb9" font-size="13" font-weight="400">.NET / React / Tauri</text><rect x="440" y="156" width="320" height="200" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M460 157H740" stroke="#a5b9ff" stroke-width="2"/><text x="464" y="188" fill="#a5b9ff" font-size="12" font-weight="400" letter-spacing="1.6">02 / REQUEST EXECUTION</text><text x="464" y="228" fill="#edf5ff" font-size="25" font-weight="700">LLM Gateway</text><text x="464" y="266" fill="#a9bed4" font-size="16" font-weight="400">Model pools + provider routing</text><text x="464" y="293" fill="#a9bed4" font-size="16" font-weight="400">Request logs + health signals</text><path d="M464 308H736" stroke="#20384e"/><text x="464" y="334" fill="#779bb9" font-size="13" font-weight="400">Routing / Bounded retries</text><rect x="840" y="156" width="320" height="200" rx="12" fill="#0b1523" stroke="#2a4058"/><path d="M860 157H1140" stroke="#82d8be" stroke-width="2"/><text x="864" y="188" fill="#82d8be" font-size="12" font-weight="400" letter-spacing="1.6">03 / UPSTREAM</text><text x="864" y="228" fill="#edf5ff" font-size="25" font-weight="700">Model providers</text><text x="864" y="266" fill="#a9bed4" font-size="16" font-weight="400">Provider protocol adapters</text><text x="864" y="293" fill="#a9bed4" font-size="16" font-weight="400">Model request execution</text><path d="M864 308H1136" stroke="#20384e"/><text x="864" y="334" fill="#779bb9" font-size="13" font-weight="400">Models / Provider offerings</text><path d="M372 252H428m-7-5 7 5-7 5" fill="none" stroke="#6b9ab9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M772 252H828m-7-5 7 5-7 5" fill="none" stroke="#6b9ab9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="393" fill="#82d8be" font-size="12" font-weight="400" letter-spacing="1.7">BRANCH DELIVERY / CLOUD DEV SUITE</text><rect x="40" y="410" width="1120" height="68" rx="12" fill="#0b1523" stroke="#2a4058"/><text x="66" y="451" fill="#d4e6f3" font-size="18" font-weight="500">Code branch</text><path d="M248 444H311m-7-5 7 5-7 5" fill="none" stroke="#55958c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="346" y="451" fill="#d4e6f3" font-size="18" font-weight="500">Build + checks</text><path d="M528 444H591m-7-5 7 5-7 5" fill="none" stroke="#55958c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="626" y="451" fill="#d4e6f3" font-size="18" font-weight="500">Working preview</text><path d="M808 444H871m-7-5 7 5-7 5" fill="none" stroke="#55958c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="906" y="451" fill="#d4e6f3" font-size="18" font-weight="500">Reuse / rollback</text></g>
